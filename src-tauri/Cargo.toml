[package]
name = "wmux"
version = "0.1.0"
description = "wmux - a terminal multiplexer for Windows, inspired by cmux"
authors = ["wmux contributors"]
edition = "2021"

[lib]
name = "wmux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
ssh2 = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
dirs = "5"
flate2 = "1"
named_pipe = "0.4"
log = "0.4"

[dev-dependencies]
tempfile = "3"
